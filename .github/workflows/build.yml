name: AnyCode Windows Repair

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package*.json"
      - "*config*"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anycode-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-repair-release
          cache-on-failure: true

      - name: Use native Windows Perl
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Strawberry\perl\bin\perl.exe')) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Native Perl installation failed' }
          }
          'C:\Strawberry\perl\bin' | Out-File -LiteralPath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run validate

      - name: Build verified frontend
        run: npm run build

      - name: Native regression tests
        working-directory: src-tauri
        run: cargo test --locked --bin any-code -j 2

      - name: Build production Windows installer
        run: npm run tauri -- build --ci --bundles nsis --config src-tauri/tauri.windows-ci.conf.json -- --locked -j 2

      - name: Package executable and record hashes
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $shortCommit = "${{ github.sha }}".Substring(0, 12)
          $tag = "anycode-repair-$version-$shortCommit"
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'anycode-release'
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          $installer = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          Copy-Item -LiteralPath $installer[0].FullName -Destination (Join-Path $releaseRoot "Any-Code-$version-x64-setup.exe")
          Compress-Archive -LiteralPath src-tauri/target/release/any-code.exe -DestinationPath (Join-Path $releaseRoot "Any-Code-$version-x64-executable.zip")
          $files = @(Get-ChildItem -LiteralPath $releaseRoot -File | ForEach-Object {
            @{ file = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{
            version = $version; commit = "${{ github.sha }}"; tag = $tag
            application_id = 'claude.workbench.app'; platform = 'windows-x64'
            update_mode = 'manual'; rust = '1.88.0'; profile = 'release'; files = $files
            executable = @{
              file = 'any-code.exe'; bytes = (Get-Item -LiteralPath src-tauri/target/release/any-code.exe).Length
              sha256 = (Get-FileHash -LiteralPath src-tauri/target/release/any-code.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $releaseRoot 'build-manifest.json') -Encoding utf8
          "RELEASE_ROOT=$releaseRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload reviewed build
        uses: actions/upload-artifact@v4
        with:
          name: AnyCode-Windows-${{ github.sha }}
          path: ${{ env.RELEASE_ROOT }}/*
          retention-days: 7
          if-no-files-found: error

      - name: Create or reuse reviewed draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expectedCommit = "${{ github.sha }}"
          $expectedVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $fileNames = @("Any-Code-$expectedVersion-x64-setup.exe", "Any-Code-$expectedVersion-x64-executable.zip")
          $assetNames = @($fileNames) + 'build-manifest.json'
          function Read-VerifiedBundle([string]$root) {
            $manifest = Get-Content -LiteralPath (Join-Path $root 'build-manifest.json') -Raw | ConvertFrom-Json
            if ($manifest.commit -cne $expectedCommit -or $manifest.tag -cne $env:RELEASE_TAG -or
                $manifest.version -cne $expectedVersion -or $manifest.application_id -cne 'claude.workbench.app' -or
                $manifest.platform -cne 'windows-x64' -or $manifest.profile -cne 'release' -or $manifest.rust -cne '1.88.0' -or
                $manifest.update_mode -cne 'manual') { throw 'Release manifest identity does not match this build' }
            $declaredNames = @($manifest.files | ForEach-Object { $_.file })
            if ($declaredNames.Count -ne $fileNames.Count -or
                @(Compare-Object $fileNames $declaredNames -CaseSensitive).Count) {
              throw 'Release manifest must name exactly the reviewed installer and executable ZIP'
            }
            foreach ($file in $manifest.files) {
              $path = Join-Path $root $file.file
              if ($file.sha256 -cnotmatch '^[a-f0-9]{64}$' -or $file.bytes -le 0 -or
                  (Get-Item -LiteralPath $path).Length -ne $file.bytes -or
                  (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $file.sha256) {
                throw "Release asset failed size/hash verification: $($file.file)"
              }
            }
            if ($manifest.executable.file -cne 'any-code.exe' -or $manifest.executable.bytes -le 0 -or
                $manifest.executable.sha256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid executable manifest' }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $root $fileNames[1]))
            try {
              if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -cne 'any-code.exe' -or
                  $zip.Entries[0].Length -ne $manifest.executable.bytes) { throw 'Executable ZIP does not match its manifest' }
              $stream = $zip.Entries[0].Open()
              try { $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)).ToLowerInvariant() }
              finally { $stream.Dispose() }
              if ($hash -cne $manifest.executable.sha256) { throw 'Executable ZIP payload hash does not match its manifest' }
            } finally { $zip.Dispose() }
            return $manifest
          }
          function Assert-ExpectedDraft($release) {
            if ($release.draft -isnot [bool] -or -not $release.draft -or
                $release.target_commitish -cne $expectedCommit -or $release.tag_name -cne $env:RELEASE_TAG) {
              throw 'Refusing to change a published release or a release targeting another commit'
            }
          }
          $currentManifest = Read-VerifiedBundle $env:RELEASE_ROOT
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed; no release was changed' }
          $existing = @(($pages | ConvertFrom-Json) | ForEach-Object { $_ } |
            Where-Object { $_.tag_name -ceq $env:RELEASE_TAG })
          if ($existing.Count -gt 1) { throw 'Release lookup returned an ambiguous tag' }
          if ($existing.Count -eq 1) {
            Assert-ExpectedDraft $existing[0]
            $existingRoot = Join-Path $env:RUNNER_TEMP ('anycode-existing-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $existingRoot | Out-Null
            gh release download $env:RELEASE_TAG --dir $existingRoot --pattern $assetNames[0] --pattern $assetNames[1] --pattern $assetNames[2]
            if ($LASTEXITCODE -ne 0) { throw 'Existing draft is incomplete; no release was changed' }
            $existingManifest = Read-VerifiedBundle $existingRoot
            $fresh = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($existing[0].id)"
            if ($LASTEXITCODE -ne 0) { throw 'Could not recheck the existing draft' }
            Assert-ExpectedDraft ($fresh | ConvertFrom-Json)
            # Same source can yield different ZIP/installer bytes; preserve the first verified bundle.
            Write-Host "Reused verified draft $env:RELEASE_TAG; existing release assets were retained."
            if (@(Compare-Object $currentManifest.files $existingManifest.files -Property file,bytes,sha256).Count) {
              Write-Host 'This rebuild has different bytes; its new bundle is available only in this run artifact.'
            }
          } else {
            $assets = @($assetNames | ForEach-Object { Join-Path $env:RELEASE_ROOT $_ })
            $notesPath = Join-Path $env:RUNNER_TEMP ('anycode-notes-' + [guid]::NewGuid().ToString('N') + '.md')
            'Claude context usage now displays the primary session and model capacity reported by native context_window or result.modelUsage, including 1M, custom models and Fast mode. It excludes sidechain snapshots and stale session or model metadata. Per-session effort, response completion, original session identity and native compaction remain. Manual updates; install after active tasks finish. Source is the release commit. Rebuilds retain the first complete verified draft bundle.' |
              Set-Content -LiteralPath $notesPath -Encoding utf8
            gh release create $env:RELEASE_TAG @assets --draft --target $expectedCommit --title "AnyCode Windows repair $env:RELEASE_TAG" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          }

      - name: Save diagnostic output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AnyCode-Windows-diagnostics-${{ github.sha }}
          path: src-tauri/target/**/build/*/output
          retention-days: 3
          if-no-files-found: ignore
