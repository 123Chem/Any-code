name: AnyCode Windows Repair

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package*.json"
      - "*config*"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anycode-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-repair-release
          cache-on-failure: true

      - name: Use native Windows Perl
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Strawberry\perl\bin\perl.exe')) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Native Perl installation failed' }
          }
          'C:\Strawberry\perl\bin' | Out-File -LiteralPath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run validate

      - name: Build verified frontend
        run: npm run build

      - name: Native regression tests
        working-directory: src-tauri
        run: cargo test --locked --bin any-code -j 2

      - name: Build production Windows installer
        run: npm run tauri -- build --ci --bundles nsis --config src-tauri/tauri.windows-ci.conf.json -- --locked -j 2

      - name: Package executable and record hashes
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $shortCommit = "${{ github.sha }}".Substring(0, 12)
          $tag = "anycode-repair-$version-$shortCommit"
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'anycode-release'
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          $installer = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          Copy-Item -LiteralPath $installer[0].FullName -Destination (Join-Path $releaseRoot "Any-Code-$version-x64-setup.exe")
          Compress-Archive -LiteralPath src-tauri/target/release/any-code.exe -DestinationPath (Join-Path $releaseRoot "Any-Code-$version-x64-executable.zip")
          $files = @(Get-ChildItem -LiteralPath $releaseRoot -File | ForEach-Object {
            @{ file = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{
            version = $version; commit = "${{ github.sha }}"; tag = $tag
            application_id = 'claude.workbench.app'; platform = 'windows-x64'
            update_mode = 'manual'; rust = '1.88.0'; profile = 'release'; files = $files
            executable = @{
              file = 'any-code.exe'; bytes = (Get-Item -LiteralPath src-tauri/target/release/any-code.exe).Length
              sha256 = (Get-FileHash -LiteralPath src-tauri/target/release/any-code.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $releaseRoot 'build-manifest.json') -Encoding utf8
          "RELEASE_ROOT=$releaseRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload reviewed build
        uses: actions/upload-artifact@v4
        with:
          name: AnyCode-Windows-${{ github.sha }}
          path: ${{ env.RELEASE_ROOT }}/*
          retention-days: 7
          if-no-files-found: error

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath $env:RELEASE_ROOT -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --draft --target "${{ github.sha }}" --title "AnyCode Windows repair $env:RELEASE_TAG" --notes "Windows repair of project/session identity, safe settings, native per-session compaction and real Claude effort. Original application data identity retained. Manual updates; install after active tasks finish. Source is the release commit."
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }

      - name: Save diagnostic output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AnyCode-Windows-diagnostics-${{ github.sha }}
          path: src-tauri/target/**/build/*/output
          retention-days: 3
          if-no-files-found: ignore
