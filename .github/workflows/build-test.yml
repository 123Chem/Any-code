name: Windows Pull Request Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: anycode-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-repair-check
      - name: Use native Windows Perl
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Strawberry\perl\bin\perl.exe')) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Native Perl installation failed' }
          }
          'C:\Strawberry\perl\bin' | Out-File -LiteralPath $env:GITHUB_PATH -Append -Encoding utf8
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - working-directory: src-tauri
        run: cargo check --locked --tests -j 2
